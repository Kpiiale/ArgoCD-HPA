apiVersion: v1
kind: Service
metadata:
  name: web-app-svc
  labels:
    app: web-app
spec:
  type: NodePort
  selector:
    app: web-app              # envía el tráfico a los Pods con esta label
  ports:
    - name: http
      port: 80                # puerto del Service dentro del clúster
      targetPort: 80          # puerto del contenedor (containerPort)
      nodePort: 30080         # puerto expuesto en el nodo (rango 30000-32767)
